<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能链接提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .tip-container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 顶部装饰条 */
        .tip-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #3498db, #2ecc71);
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e8f4fc;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .icon i {
            font-size: 30px;
            color: #3498db;
        }

        .main-title {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .desc-text {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .desc-text strong {
            color: #e74c3c;
        }

        /* 功能名称标签样式 */
        .functions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 30px 0;
        }

        .func-tag {
            padding: 12px 22px;
            background: #f8f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .func-tag:hover {
            background: #3498db;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.2);
        }

        .warning-note {
            margin-top: 25px;
            font-size: 14px;
            color: #95a5a6;
            line-height: 1.6;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 15px;
            color: #3498db;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .tip-container {
                padding: 30px 20px;
            }
            
            .main-title {
                font-size: 22px;
            }
            
            .func-tag {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="tip-container">
        <div class="icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        
        <h1 class="main-title">站外链接温馨提示</h1>
        
        <p class="desc-text">
            检测到您即将访问以下功能入口：<br>
            <strong>草稿、认识、数据、详情、日历、拾物</strong>
        </p>
        
        <p class="desc-text">
            以上所有功能及跳转链接，<strong>均属于站外第三方链接</strong>，<br>
            点击后将离开当前站点，请自行判断内容安全性，谨慎操作。
        </p>

        <!-- 展示所有功能名称 -->
        <div class="functions">
            <span class="func-tag">草稿</span>
            <span class="func-tag">认识</span>
            <span class="func-tag">数据</span>
            <span class="func-tag">详情</span>
            <span class="func-tag">日历</span>
            <span class="func-tag">拾物</span>
        </div>

        <p class="warning-note">
            ⚠️ 温馨提醒：请勿随意在外部链接中输入账号、密码、验证码等隐私信息，<br>
            以防造成信息泄露。
        </p>

        <p class="footer-note">所有链接均为公开网络资源，请知晓 ~</p>
    </div>
</body>
</html>
