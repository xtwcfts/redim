<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格测试</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background-color: #4a6fa5;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .quiz-container {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .question-area {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f9f9f9;
            min-height: 100px;
        }
        
        .options-area {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option {
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .next-option {
            background-color: #e1f0ff;
            border: 2px solid #4a90e2;
        }
        
        .prev-option {
            background-color: #f8f8f8;
            border: 2px solid #ddd;
        }
        
        .option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .option.selected {
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
        }
        
        .timer-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .timer {
            display: inline-block;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 50px;
            transition: all 0.5s;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .prev-btn {
            background-color: #f8f8f8;
            color: #333;
        }
        
        .next-btn {
            background-color: #4a90e2;
            color: white;
        }
        
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            display: none;
        }
        
        .progress-container {
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #4a90e2;
            width: 0%;
            transition: width 0.3s;
        }
        
        .result-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 5px solid #4a90e2;
        }
        
        .completed-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 5px solid #F44336;
            text-align: center;
        }
        
        .correct-answer {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .user-answer {
            color: #4a90e2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>性格测试</h1>
        <p>共10题，每题10分，测试时间每题30秒</p>
    </div>
    
    <div class="quiz-container" id="quiz-container">
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <p>已完成 <span id="progress-text">0</span>/10 题</p>
        </div>
        
        <div class="timer-container">
            <div class="timer" id="timer">30</div>
        </div>
        
        <div class="question-area" id="question-area">
            <h2 id="question-text">题目加载中...</h2>
        </div>
        
        <div class="options-area" id="options-area">
            <!-- 选项将通过JavaScript动态生成 -->
        </div>
        
        <div class="navigation">
            <button class="prev-btn" id="prev-btn" disabled>上一题</button>
            <button class="next-btn" id="next-btn">下一题</button>
            <button class="submit-btn" id="submit-btn">提交答案</button>
        </div>
    </div>
    
    <div class="result-container" id="result-container">
        <h2>测试结果</h2>
        <div id="result-content"></div>
        <p id="score-display"></p>
    </div>
    
    <div class="completed-message" id="completed-message">
        <h2>您已经完成过本次测试</h2>
        <p>每个设备只能答题一次，感谢您的参与！</p>
    </div>
    
    <script>
        // 测试题目
        const questions = [
            {
                question: "1. 在周末，你更倾向于：",
                options: [
                    "独自在家看书或看电影",
                    "和朋友一起外出聚会"
                ],
                answer: 0,
                explanation: "选择独自活动更倾向i人，选择社交活动更倾向e人"
            },
            {
                question: "2. 在社交场合中，你通常：",
                options: [
                    "感到精力充沛，喜欢与人交流",
                    "感到消耗精力，需要独处恢复"
                ],
                answer: 1,
                explanation: "e人从社交中获得能量，i人从独处中获得能量"
            },
            {
                question: "3. 当遇到问题时，你更可能：",
                options: [
                    "自己思考解决方案",
                    "与他人讨论寻找方案"
                ],
                answer: 0,
                explanation: "i人倾向于独立思考，e人倾向于通过讨论解决问题"
            },
            {
                question: "4. 在大型聚会中，你通常：",
                options: [
                    "认识很多人并主动交谈",
                    "与少数熟悉的人深入交流"
                ],
                answer: 1,
                explanation: "e人喜欢广泛社交，i人偏好深度交流"
            },
            {
                question: "5. 你更喜欢的工作方式是：",
                options: [
                    "团队合作，经常头脑风暴",
                    "独立工作，有安静的空间"
                ],
                answer: 1,
                explanation: "e人偏好协作环境，i人偏好独立工作空间"
            },
            {
                question: "6. 当认识新朋友时，你通常：",
                options: [
                    "主动介绍自己并开启对话",
                    "等待别人先开口"
                ],
                answer: 1,
                explanation: "e人更主动社交，i人更被动"
            },
            {
                question: "7. 你更享受哪种学习方式：",
                options: [
                    "小组讨论和互动",
                    "独自阅读和研究"
                ],
                answer: 1,
                explanation: "e人偏好互动学习，i人偏好自主学习"
            },
            {
                question: "8. 在表达想法时，你通常：",
                options: [
                    "先说出来再完善想法",
                    "先思考清楚再表达"
                ],
                answer: 1,
                explanation: "e人通过说话思考，i人先思考再说话"
            },
            {
                question: "9. 你认为自己是一个：",
                options: [
                    "外向、健谈的人",
                    "内向、安静的人"
                ],
                answer: 1,
                explanation: "这是最直接的i/e人区分标准"
            },
            {
                question: "10. 在压力下，你更可能：",
                options: [
                    "寻求他人支持和安慰",
                    "独自处理情绪"
                ],
                answer: 1,
                explanation: "e人倾向于寻求外部支持，i人倾向于自我调节"
            }
        ];
        
        // 获取DOM元素
        const questionText = document.getElementById('question-text');
        const optionsArea = document.getElementById('options-area');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress');
        const progressText = document.getElementById('progress-text');
        const resultContainer = document.getElementById('result-container');
        const resultContent = document.getElementById('result-content');
        const scoreDisplay = document.getElementById('score-display');
        const quizContainer = document.getElementById('quiz-container');
        const completedMessage = document.getElementById('completed-message');
        
        // 初始化变量
        let currentQuestion = 0;
        let userAnswers = Array(questions.length).fill(null);
        let timer;
        let timeLeft = 30;
        let isLocked = false;
        let lockedQuestions = [];
        
        // 生成设备唯一标识符
        function getDeviceId() {
            // 尝试从localStorage获取设备ID
            let deviceId = localStorage.getItem('device_id');
            
            // 如果没有设备ID，创建一个新的
            if (!deviceId) {
                // 使用用户代理信息和一些随机数创建ID
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + 
                          '_' + navigator.userAgent.length + 
                          '_' + (navigator.hardwareConcurrency || 'unknown');
                
                // 存储设备ID
                localStorage.setItem('device_id', deviceId);
            }
            
            return deviceId;
        }
        
        // 检查是否已完成测试
        function checkTestCompletion() {
            const deviceId = getDeviceId();
            const completedTests = JSON.parse(localStorage.getItem('completed_tests') || '{}');
            
            // 如果该设备已完成测试，显示完成消息并隐藏测试界面
            if (completedTests[deviceId]) {
                quizContainer.style.display = 'none';
                completedMessage.style.display = 'block';
                return true;
            }
            
            return false;
        }
        
        // 标记测试为已完成
        function markTestAsCompleted() {
            const deviceId = getDeviceId();
            const completedTests = JSON.parse(localStorage.getItem('completed_tests') || '{}');
            
            // 标记该设备已完成测试
            completedTests[deviceId] = true;
            localStorage.setItem('completed_tests', JSON.stringify(completedTests));
        }
        
        // 从本地存储加载进度
        function loadProgress() {
            // 如果测试已完成，不再加载进度
            if (checkTestCompletion()) return;
            
            const savedProgress = localStorage.getItem('i_e_test_progress');
            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                currentQuestion = progress.currentQuestion;
                userAnswers = progress.userAnswers;
                lockedQuestions = progress.lockedQuestions || [];
                
                // 更新进度显示
                updateProgress();
                
                // 如果所有问题已回答，显示结果
                if (currentQuestion >= questions.length) {
                    showResults();
                }
            }
        }
        
        // 保存进度到本地存储
        function saveProgress() {
            const progress = {
                currentQuestion: currentQuestion,
                userAnswers: userAnswers,
                lockedQuestions: lockedQuestions
            };
            localStorage.setItem('i_e_test_progress', JSON.stringify(progress));
        }
        
        // 显示当前问题
        function showQuestion() {
            // 清除之前的选项
            optionsArea.innerHTML = '';
            
            // 设置问题文本
            questionText.textContent = questions[currentQuestion].question;
            
            // 创建选项
            questions[currentQuestion].options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.classList.add('option');
                
                // 根据是否是当前问题设置不同的样式
                if (userAnswers[currentQuestion] === null) {
                    optionElement.classList.add('next-option');
                } else {
                    optionElement.classList.add('prev-option');
                }
                
                // 如果已经选择了这个选项，添加selected类
                if (userAnswers[currentQuestion] === index) {
                    optionElement.classList.add('selected');
                }
                
                optionElement.textContent = option;
                optionElement.dataset.index = index;
                
                // 添加点击事件
                optionElement.addEventListener('click', () => {
                    if (!isLocked || !lockedQuestions.includes(currentQuestion)) {
                        selectOption(index);
                    }
                });
                
                optionsArea.appendChild(optionElement);
            });
            
            // 更新导航按钮状态
            updateNavButtons();
            
            // 更新进度
            updateProgress();
            
            // 重置计时器
            resetTimer();
        }
        
        // 选择选项
        function selectOption(index) {
            // 取消之前的选择
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            
            // 标记新选择
            options[index].classList.add('selected');
            userAnswers[currentQuestion] = index;
            
            // 保存进度
            saveProgress();
        }
        
        // 更新导航按钮状态
        function updateNavButtons() {
            prevBtn.disabled = currentQuestion === 0;
            
            if (currentQuestion < questions.length - 1) {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            }
            
            // 如果当前问题已锁定，禁用上一题按钮
            if (lockedQuestions.includes(currentQuestion - 1)) {
                prevBtn.disabled = true;
            }
        }
        
        // 更新进度条
        function updateProgress() {
            const answeredCount = userAnswers.filter(answer => answer !== null).length;
            const progressPercent = (answeredCount / questions.length) * 100;
            
            progressBar.style.width = `${progressPercent}%`;
            progressText.textContent = answeredCount;
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(timer);
            timeLeft = 30;
            updateTimerDisplay();
            
            // 如果不是最后一题且当前问题未锁定，启动计时器
            if (currentQuestion < questions.length - 1 && !lockedQuestions.includes(currentQuestion)) {
                isLocked = false;
                startTimer();
            } else {
                isLocked = true;
            }
        }
        
        // 启动计时器
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isLocked = true;
                    lockedQuestions.push(currentQuestion);
                    saveProgress();
                }
            }, 1000);
        }
        
        // 更新计时器显示
        function updateTimerDisplay() {
            timerDisplay.textContent = timeLeft;
            
            // 根据剩余时间改变颜色
            if (timeLeft > 20) {
                timerDisplay.style.backgroundColor = '#4CAF50'; // 绿色
                timerDisplay.style.color = 'white';
            } else if (timeLeft > 10) {
                timerDisplay.style.backgroundColor = '#FFC107'; // 黄色
                timerDisplay.style.color = 'black';
            } else {
                timerDisplay.style.backgroundColor = '#F44336'; // 红色
                timerDisplay.style.color = 'white';
            }
        }
        
        // 显示结果
        function showResults() {
            // 标记测试为已完成
            markTestAsCompleted();
            
            // 计算分数
            let score = 0;
            let resultHTML = '';
            
            questions.forEach((q, index) => {
                const isCorrect = userAnswers[index] === q.answer;
                if (isCorrect) score += 10;
                
                resultHTML += `
                    <div class="question-result">
                        <p><strong>问题 ${index + 1}:</strong> ${q.question}</p>
                        <p><span class="user-answer">你的答案:</span> ${q.options[userAnswers[index]]}</p>
                        <p><span class="correct-answer">正确答案:</span> ${q.options[q.answer]}</p>
                        <p><em>${q.explanation}</em></p>
                        <hr>
                    </div>
                `;
            });
            
            resultContent.innerHTML = resultHTML;
            scoreDisplay.textContent = `你的得分: ${score}/100`;
            
            // 判断i人还是e人
            const iScore = score; // 在这个测试中，得分越高越倾向i人
            let personalityType;
            let personalityDesc;
            
            if (iScore >= 70) {
                personalityType = "明显的i人";
                personalityDesc = "你是一个典型的内向者(i人)，喜欢独处，从内部世界获得能量，偏好深度思考和一对一的交流。";
            } else if (iScore >= 40) {
                personalityType = "中等倾向的i人";
                personalityDesc = "你有内向倾向，但也能在需要时表现出外向特质。你根据情境在不同程度上享受社交和独处。";
            } else if (iScore >= 30) {
                personalityType = "中等倾向的e人";
                personalityDesc = "你有外向倾向，但也能享受独处时光。你从社交中获得能量，但也需要一些时间反思。";
            } else {
                personalityType = "明显的e人";
                personalityDesc = "你是一个典型的外向者(e人)，充满活力，喜欢社交，从外部世界获得能量，善于表达和交流。";
            }
            
            resultContent.insertAdjacentHTML('afterbegin', `
                <h3>你的性格类型: ${personalityType}</h3>
                <p>${personalityDesc}</p>
            `);
            
            // 显示结果容器
            resultContainer.style.display = 'block';
            
            // 隐藏测试容器
            quizContainer.style.display = 'none';
            
            // 滚动到结果
            resultContainer.scrollIntoView({ behavior: 'smooth' });
            
            // 清除本地存储中的进度(保留完成状态)
            localStorage.removeItem('i_e_test_progress');
        }
        
        // 事件监听器
        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (userAnswers[currentQuestion] !== null) {
                currentQuestion++;
                
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showResults();
                }
                
                saveProgress();
            } else {
                alert('请先选择一个答案');
            }
        });
        
        submitBtn.addEventListener('click', () => {
            if (userAnswers[currentQuestion] !== null) {
                showResults();
                saveProgress();
            } else {
                alert('请先选择一个答案');
            }
        });
        
        // 初始化
        loadProgress();
        
        // 只有未完成测试时才显示测试界面
        if (!checkTestCompletion()) {
            showQuestion();
        }
    </script>
</body>
</html>
